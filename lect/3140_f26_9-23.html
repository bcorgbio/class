# More complex models

## Phylogenetic Least Squares

- Models that include process (mode) and relationships

- using `nlme::gls()`

- correlation functions from `ape` package (e.g.`corBrownian()` for BM, `corMartins()` for OU)



``` r
library(nlme)
# PGLS under BM,
fit_bm &lt;- gls(log(met) ~ log(mass), correlation = corBrownian(1, phy = phy, form = ~spec),
    data = d, method = "ML")

# PGLS under OU
fit_ou &lt;- gls(log(met) ~ log(mass), correlation = corMartins(1, phy = phy, form = ~spec),
    data = d, method = "ML")

d$pred_bm &lt;- predict(fit_bm)
d$pred_ou &lt;- predict(fit_ou)
```

---

&lt;!-- slide 1 --&gt;

# Phylogenetic Least Squares


``` r
d %&gt;% 
  pivot_longer(pred_ou:pred_bm,names_to = "evol_model") %&gt;% 
  ggplot(aes(log(mass),log(met)))+
  geom_point() +
  geom_smooth(method="lm")+
  geom_smooth(method="lm",aes(y=value,col=evol_model))
```

![](3140_f26_9-23_files/figure-html/unnamed-chunk-11-1.png)&lt;!-- --&gt;

# Phylogenetic Least Squares: model choice

Which model should we interpret?

Using AIC: 


``` r
AIC(fit_bm, fit_ou)
```

```
##        df       AIC
## fit_bm  3 -18.34618
## fit_ou  4 -14.01221
```

``` r
anova(fit_bm)
```

```
## Denom. DF: 18 
##             numDF   F-value p-value
## (Intercept)     1 146.33972  &lt;.0001
## log(mass)       1   0.24361  0.6276
```

---

&lt;!-- slide 1 --&gt;

# Phylogenetic Least Squares: model choice

Which model should we interpret?

Using *corrected* AIC (`\(AIC_{c}\)`):

.pull-left[]

``` r
library(MuMIn)
AICc(fit_bm, fit_ou)
```

```
##        df      AICc
## fit_bm  3 -16.84618
## fit_ou  4 -11.34554
```

``` r
anova(fit_bm)
```

```
## Denom. DF: 18 
##             numDF   F-value p-value
## (Intercept)     1 146.33972  &lt;.0001
## log(mass)       1   0.24361  0.6276
```
]


.pull-right[

### AIC
`\(\mathrm{AIC} = 2k - 2\ln(\hat{L})\)`

### `\(AIC_c\)`

`\(\mathrm{AIC}_c = \mathrm{AIC} + \frac{2k(k + 1)}{n - k - 1}\)`
]

---
# Phylogenetic Least Squares: model choice

Which model should we interpret?

Using *corrected* AIC weights (`\(AIC_{cw}\)`):

.pull-left[

``` r
library(MuMIn)
AICc(fit_bm, fit_ou) %&gt;%
    Weights()
```

```
##  model weights 
## [1] 0.94 0.06
```

``` r
anova(fit_bm)
```

```
## Denom. DF: 18 
##             numDF   F-value p-value
## (Intercept)     1 146.33972  &lt;.0001
## log(mass)       1   0.24361  0.6276
```
]

.pull-right[


### `\(AIC_w\)`
`\(w_{i}=\frac{\exp \left(-\frac{1}{2}\Delta _{i}\right)}{\sum _{R=1}^{R}\exp \left(-\frac{1}{2}\Delta _{R}\right)}\)`
]
